name: OCaml Images

on:
  push:
    branches:
      - '**'

jobs:
  versions:
    uses: ./.github/workflows/ocaml-versions.yml
  devcontainer:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.builds_matrix) }}
    permissions:
      packages: write
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: image
      id: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: smoke test (devcontainer)
      run: |
        ${{ steps.devcontainer.outputs.exec }} sh -ceu '
          echo "hello world"
          if [ "$PLATFORM" = linux/s390x ]; then
            test "$(dpkg --print-architecture)" = s390x
            opam exec -- ocamlc -config | grep -q "^architecture: s390x$"
          fi
        '
