name: OCaml Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    uses: ./.github/workflows/ocaml-versions.yml
  build:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.builds_matrix) }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
        username: ${{ github.actor }}
        password: ''
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: ccache keys
      id: ccache_keys
      run: |
        platform='${{ matrix.platform }}'
        {
          echo "month=$(date +'%Y-%m')"
          echo "platform=${platform//\//-}"
          echo "flatbuffers=$(git rev-parse HEAD:flatbuffers)"
        } >> "$GITHUB_OUTPUT"
    # The runner manages this cache while the devcontainer uses the same files
    # through the workspace bind mount. The C++ build is independent of the
    # OCaml version, so all compiler jobs for one target platform share it.
    - name: ccache cache
      uses: actions/cache@v6
      with:
        path: flatbuffers/.ccache
        key: ccache-${{ steps.ccache_keys.outputs.platform }}-${{ steps.ccache_keys.outputs.month }}-${{ steps.ccache_keys.outputs.flatbuffers }}-${{ hashFiles('Makefile', 'src/bfbs_gen_ocaml.cpp', 'src/bfbs_gen_ocaml.h', 'patches/ocaml-integration.patch') }}
        restore-keys: |
          ccache-${{ steps.ccache_keys.outputs.platform }}-${{ steps.ccache_keys.outputs.month }}-${{ steps.ccache_keys.outputs.flatbuffers }}-
          ccache-${{ steps.ccache_keys.outputs.platform }}-${{ steps.ccache_keys.outputs.month }}-
    - name: info
      run: |
        ${{ env.EXEC }} sh -c '
          uname -m
          dpkg --print-architecture
          getconf LONG_BIT
          opam exec -- ocamlc -config | grep "^architecture:"
          opam exec -- ocaml --version
        '
    - name: verify s390x target
      if: ${{ matrix.platform == 'linux/s390x' }}
      run: |
        ${{ env.EXEC }} sh -ceu '
          test "$(dpkg --print-architecture)" = s390x
          test "$(getconf LONG_BIT)" = 64
          opam exec -- ocamlc -config | grep -q "^architecture: s390x$"
        '
    - name: check OCaml formatting
      if: ${{ matrix.ocaml_version == '5.4.1' && matrix.platform == 'linux/amd64' }}
      run: |
        ${{ env.EXEC }} make format-check
    - name: build flatc
      run: |
        mkdir -p flatbuffers/.ccache
        # $PWD must expand inside the devcontainer.
        # shellcheck disable=SC2016
        ${{ env.EXEC }} sh -ceu '
          export CCACHE_DIR="$PWD/flatbuffers/.ccache"
          export CCACHE_MAXSIZE=500M
          export CCACHE_COMPILERCHECK=content
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --zero-stats
          make flatc
          ccache --show-stats
        '
        if [ "${{ matrix.platform }}" = linux/s390x ]; then
          file flatc.ocaml | grep -E 'IBM S/390|s390'
        fi
    - name: install ocaml deps
      run: |
        ${{ env.EXEC }} bash -c '. /etc/bash.bashrc && sudo OPAMROOT=$OPAMROOT make deps'
    - name: test
      run: |
        ${{ env.EXEC }} make test
    - name: test jsoo
      run: |
        ${{ env.EXEC }} make test-jsoo
    - name: test melange
      # Melange requires OCaml 4.14+ and does not support 32-bit x86 or ARM.
      if: matrix.ocaml_version != '4.13.1' && matrix.platform != 'linux/i386' && matrix.platform != 'linux/arm/v7'
      run: |
        ${{ env.EXEC }} make test-melange
    - name: benchmark
      # The benchmark checksum uses OCaml int values that cannot represent the
      # 64-bit fixture ID on 32-bit targets.
      if: matrix.platform != 'linux/i386' && matrix.platform != 'linux/arm/v7'
      run: |
        ${{ env.EXEC }} make bench
    - name: generate-check
      run: |
        ${{ env.EXEC }} make generate-check
    - name: check tree is clean
      run: |
        if ! git diff --quiet -- . ':!flatbuffers'; then
          echo "::error::Source tree was modified during build/test"
          git diff --stat -- . ':!flatbuffers'
          exit 1
        fi
        if [ -n "$(git ls-files --others --exclude-standard -- . ':!flatbuffers')" ]; then
          echo "::error::Untracked files appeared during build/test"
          git ls-files --others --exclude-standard -- . ':!flatbuffers'
          exit 1
        fi
